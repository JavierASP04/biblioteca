{% if pagination and pagination.pages > 1 %}
<nav class="pagination" aria-label="Paginación">
    {% if pagination.has_prev %}
    <a class="btn btn-ghost btn-sm" href="{{ url_for(request.endpoint, **dict(request.args, page=pagination.prev_num)) }}">
        <i class="fas fa-chevron-left"></i> Anterior
    </a>
    {% endif %}
    <span>Página {{ pagination.page }} de {{ pagination.pages }}</span>
    {% if pagination.has_next %}
    <a class="btn btn-ghost btn-sm" href="{{ url_for(request.endpoint, **dict(request.args, page=pagination.next_num)) }}">
        Siguiente <i class="fas fa-chevron-right"></i>
    </a>
    {% endif %}
</nav>
{% endif %}
